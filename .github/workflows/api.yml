# CI de la API (api-reservas-deportivas). Es el mismo CI que trae la cátedra en
# api-reservas-deportivas/.github/workflows/ci.yml, adaptado al monorepo: GitHub sólo ejecuta los
# workflows de la carpeta .github de la RAÍZ del repositorio, por eso el original no corría.
name: CI de la API

on:
  push:
    branches: [main]
    paths: ['api-reservas-deportivas/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['api-reservas-deportivas/**', '.github/workflows/api.yml']

defaults:
  run:
    working-directory: api-reservas-deportivas

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: [UTC, America/Argentina/Buenos_Aires]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: api-reservas-deportivas/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: api-reservas-deportivas/.nvmrc
          cache: pnpm
          cache-dependency-path: api-reservas-deportivas/pnpm-lock.yaml
      # Exige pnpm-lock.yaml al día: si falla, correr `pnpm install` y commitearlo
      - run: pnpm install --frozen-lockfile
      - run: pnpm verificar

  matriz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, America/Argentina/Buenos_Aires]
        base:
          - { motor: postgres, url: 'postgres://api:api@127.0.0.1:55432/api' }
          - { motor: mysql, url: 'mysql://api:api@127.0.0.1:53306/api' }
          - { motor: mariadb, url: 'mysql://api:api@127.0.0.1:53307/api' }
    env:
      TZ: ${{ matrix.tz }}
      DB_MOTOR: ${{ matrix.base.motor }}
      DB_URL: ${{ matrix.base.url }}
      S3_PRUEBAS_ENDPOINT: http://127.0.0.1:58080
    services:
      s3:
        image: andrewgaul/s3proxy:sha-f892634
        env: { S3PROXY_AUTHORIZATION: none, JCLOUDS_PROVIDER: transient }
        ports: ['58080:8080']
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: api, POSTGRES_PASSWORD: api, POSTGRES_DB: api }
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U api -d api" --health-interval 3s --health-timeout 3s --health-retries 40
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: api, MYSQL_DATABASE: api, MYSQL_USER: api, MYSQL_PASSWORD: api }
        ports: ['53306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uapi -papi" --health-interval 3s --health-timeout 3s --health-retries 60
      mariadb:
        image: mariadb:11
        env: { MARIADB_ROOT_PASSWORD: api, MARIADB_DATABASE: api, MARIADB_USER: api, MARIADB_PASSWORD: api }
        ports: ['53307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 3s --health-timeout 3s --health-retries 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: api-reservas-deportivas/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: api-reservas-deportivas/.nvmrc
          cache: pnpm
          cache-dependency-path: api-reservas-deportivas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run test/storage/s3-storage.spec.ts
      - run: pnpm test:e2e

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: api-reservas-deportivas/.nvmrc
      - run: node scripts/test-docker.mjs
